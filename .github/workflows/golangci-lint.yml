---
name: golangci-lint

on:
  pull_request:
    paths:
      - '**/*.go'
  push:
    paths:
      - '**/*.go'
  schedule:
    - cron: 0 0 * * 0

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Download Go Modules
        run: go mod download
      - name: Build
        run: go build -v .
      - name: Run Linters
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: latest